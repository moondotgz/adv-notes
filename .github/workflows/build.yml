name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install NDK and CMake (runner's preinstalled SDK)
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Translations up to date
        run: python3 scripts/i18n.py --check
      - name: Fetch Robolectric's Android jar (cached by Gradle; Maven Central sometimes rate-limits)
        run: ./gradlew :app:robolectricJars || { echo "Retrying in 60 s"; sleep 60; ./gradlew :app:robolectricJars; }
      - name: Unit tests
        # Robolectric downloads its Android jars from Maven during the first test; that download
        # sometimes fails on the runner, so retry once before treating it as a real failure.
        run: ./gradlew :app:testDebugUnitTest || { echo "Retrying tests once"; sleep 20; ./gradlew :app:testDebugUnitTest; }
      - name: Load release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ADVNOTES_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ADVNOTES_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret set; using the debug key"
          fi
      - name: Build release APK
        env:
          ADVNOTES_KEYSTORE_PASSWORD: ${{ secrets.ADVNOTES_KEYSTORE_PASSWORD }}
          ADVNOTES_KEY_ALIAS: ${{ secrets.ADVNOTES_KEY_ALIAS }}
          ADVNOTES_KEY_PASSWORD: ${{ secrets.ADVNOTES_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: adv-notes-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish release for a new version on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"; exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk "adv-notes-$TAG.apk"
          gh release create "$TAG" "adv-notes-$TAG.apk" --target "$GITHUB_SHA" \
            --title "Adv Notes $VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
